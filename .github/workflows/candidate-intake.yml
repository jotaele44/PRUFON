name: candidate-intake

# Reviewed candidate-intake pipeline.
#
# Runs scripts/import_candidates.py --apply on a caller-supplied local JSONL feed,
# routing rows into the candidate + aux ledgers (already_listed / updates_new_evidence
# / echoes_noise). The master ledger is read-only: import_candidates never writes it,
# and the pull request opened below explicitly excludes data/master/ from its changes.
# Promotion into master remains a separate, human-gated step (scripts/promote_candidate.py).

on:
  workflow_dispatch:
    inputs:
      feed:
        description: "Path (in the repo/workspace) to a local JSONL candidate feed to ingest"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # PRII_FETCH_HUB: ensure shared federation libs resolve
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          python -m pip install -r requirements.txt

      - name: Run candidate intake (routes into aux ledgers; never master)
        run: |
          python scripts/import_candidates.py "${{ inputs.feed }}" \
            --apply \
            --report reports/intake/routing_report.csv

      - name: Validate ledgers after intake
        run: |
          python3 scripts/validate_case_ledgers.py \
            data/candidates/candidate_cases.jsonl \
            data/master/master_cases.jsonl \
            data/already_listed.jsonl \
            data/updates_new_evidence.jsonl \
            data/echoes_noise.jsonl

      - name: Upload routing report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intake-routing-report
          path: reports/intake/routing_report.csv
          if-no-files-found: warn

      - name: Open intake pull request (candidate + aux ledgers only; never master)
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          base: main
          branch: candidate-intake/routed-feed
          delete-branch: true
          # Explicitly scope committed paths so master_cases.jsonl can never be included.
          add-paths: |
            data/candidates/candidate_cases.jsonl
            data/already_listed.jsonl
            data/updates_new_evidence.jsonl
            data/echoes_noise.jsonl
            reports/intake/routing_report.csv
          commit-message: "Candidate intake: route local feed into candidate/aux ledgers (never master)"
          title: "Candidate intake: routed feed rows into candidate/aux ledgers"
          labels: candidate-intake
          body: |
            Automated candidate intake run of `scripts/import_candidates.py --apply`.

            - Feed: `${{ inputs.feed }}`
            - Routed rows appended to the candidate and aux ledgers only.
            - `data/master/master_cases.jsonl` is **not** touched (read-only by doctrine).
            - Routing report attached as the `intake-routing-report` workflow artifact.

            Promotion of any of these rows into the master ledger is a separate,
            human-reviewed step (`scripts/promote_candidate.py --record-id <id> --i-have-reviewed`).
