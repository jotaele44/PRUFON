name: ci-diagnostic-ovnis

on:
  pull_request:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/ci-diagnostic-ovnis.yml"

permissions:
  contents: read

jobs:
  capture-frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Capture npm and Vite diagnostics
        shell: bash
        run: |
          set +e
          cd dashboard
          npm ci --no-audit --no-fund > ../ovnis-frontend-diagnostic.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            npm run build >> ../ovnis-frontend-diagnostic.log 2>&1
            status=$?
          fi
          echo "exit_status=$status" >> ../ovnis-frontend-diagnostic.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: ovnis-frontend-diagnostic
          path: ovnis-frontend-diagnostic.log
          if-no-files-found: error
