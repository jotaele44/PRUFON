name: OVNIS CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo (and uploads artifacts,
# which uses the runtime token, not GITHUB_TOKEN). Widen deliberately if a
# step ever needs to write back.
permissions:
  contents: read

# Supersede older runs of this workflow on the same ref: a newer push
# makes the in-flight result irrelevant, so cancel it and free the runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Compile scripts
        run: python -m py_compile scripts/*.py
      - name: Case schema is well-formed JSON
        run: python -c "import json; json.load(open('data/schemas/case.schema.json')); print('schema ok')"
      - name: Validate case ledgers
        run: python3 scripts/validate_case_ledgers.py
      - name: Install test dependencies
        run: |
          # PRII_FETCH_HUB: ensure shared federation libs resolve
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          python -m pip install -r requirements.txt httpx -r server/backend/requirements.txt
      - name: Run unit tests
        run: python -m pytest -q --cov --cov-report=term-missing:skip-covered
      - name: Export canonical streams (smoke)
        run: |
          python3 scripts/federation_export.py --mode test
          test -f exports/federation/manifest.json
      - name: Production export succeeds with real case data
        run: |
          python3 scripts/federation_export.py --mode production
          test -f exports/federation/manifest.json
          echo "OK: production export completed with real case data"

  # Reproducible installs: recompiles requirements.lock from requirements.txt and
  # fails if the committed lock is stale, so a dependency change cannot merge
  # without its lockfile update. Mirrors moneysweep-pr/.github/workflows/lockfile.yml.
  # uv seeds the resolution from the existing lock, so an unrelated upstream
  # release does not spuriously fail this job.
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Recompile the lockfile
        run: |
          # PRII_FETCH_HUB: requirements.txt references ../thehub-pr editable paths
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          uv pip compile requirements.txt --universal --python-version 3.12 -o requirements.lock
      - name: Assert no drift
        run: |
          if ! git diff --exit-code requirements.lock; then
            echo "::error::requirements.lock is out of date with requirements.txt." \
              "Run: uv pip compile requirements.txt --universal --python-version 3.12 -o requirements.lock"
            exit 1
          fi

  # Lint and type gates. ruff is GATING — the repo is ruff-clean as of the commit
  # that added pyproject.toml. mypy is REPORT-ONLY: `files` in [tool.mypy] scopes
  # it to scripts/ and maintenance/, and the remaining findings are Optional
  # narrowing that has not been annotated yet. Drop continue-on-error to make it
  # gating once those are cleared.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint deps
        run: |
          # PRII_FETCH_HUB: ensure shared federation libs resolve
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          python -m pip install ruff mypy -r requirements.txt
      - name: Ruff
        run: ruff check .
      - name: Mypy (report-only)
        continue-on-error: true
        run: python -m mypy

  # Frontend gate. The dashboard package has shipped with a `lint` script, an eslint
  # config and a committed package-lock.json, but no CI job ran any of them —
  # the only workflow that built it was desktop-build.yml, which is tag- and
  # path-triggered and does not fire on a frontend-only PR. So a lint regression
  # or a broken build could merge unnoticed.
  #
  # Gates `lint`, `test` and `build`, matching skywatcher-pr and thehub-pr.
  # `typecheck` is deliberately still absent: this package has no such script,
  # and adding one would mean turning on a gate over pre-existing findings.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build
