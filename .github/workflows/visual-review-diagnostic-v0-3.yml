name: visual-review-diagnostic-v0-3

on:
  pull_request:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/visual-review-diagnostic-v0-3.yml"

permissions:
  contents: read

jobs:
  browser-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard and Chromium
        working-directory: dashboard
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Create deterministic review pages
        working-directory: dashboard
        run: |
          cat > visual-review.html <<'HTML'
          <!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>OVNIS visual review</title></head><body><div id="root"></div><script type="module" src="/src/visual-review.jsx"></script></body></html>
          HTML
          cat > src/visual-review.jsx <<'JSX'
          import React from 'react'
          import ReactDOM from 'react-dom/client'
          import '@fontsource-variable/inter'
          import '@fontsource/jetbrains-mono'
          import '@/index.css'
          import '@pr-federation/react/styles.css'
          import '@/styles/federation.css'
          import CaseGrid from '@/components/CaseGrid.jsx'
          import CaseDetail from '@/components/CaseDetail.jsx'

          document.documentElement.dataset.repo = 'ovnis-pr'
          document.documentElement.dataset.theme = 'dark'

          const common = {
            date_raw: '2026-07-25',
            decade: '2020s',
            description: 'Controlled visual-review record with a long description to exercise wrapping without changing production data.',
            evidence_tier: 'T1',
            evidence_type: 'Official record',
            confidence: 'high',
            source_family: 'FAA',
            location: { municipality: 'San Juan', place: 'Controlled review location', lat: 18.4655, lon: -66.1057 },
            witness: { class: 'Official', count: 2, name: 'Review fixture' },
          }
          const validCase = { ...common, case_id: 'PRUFON-TEST-001', source_url: 'https://example.com/source-record', source_citation: 'Official source record' }
          const noUrlCase = { ...common, case_id: 'PRUFON-TEST-002', source_url: 'Inexplicata / Scott Corrales', source_citation: 'Inexplicata / Scott Corrales' }
          const cases = [validCase, noUrlCase]
          const mode = new URLSearchParams(window.location.search).get('mode') || 'grid'
          const selected = mode === 'valid' ? validCase : mode === 'no-url' ? noUrlCase : null

          function Harness() {
            return <main className="min-h-screen bg-slate-950 p-3 text-slate-100">
              <h1 className="mb-2 text-lg font-semibold">OVNIS Source Review</h1>
              <section id="case-grid-review" className="h-[420px] overflow-hidden rounded-lg border border-slate-800 bg-slate-950">
                <CaseGrid cases={cases} selectedId={selected?.case_id} onSelect={() => {}} />
              </section>
              <CaseDetail case={selected} onClose={() => {}} />
            </main>
          }
          ReactDOM.createRoot(document.getElementById('root')).render(<Harness />)
          JSX
          cat > visual-review.spec.mjs <<'JS'
          import { chromium } from 'playwright'
          import fs from 'node:fs'

          const output = 'visual-artifacts'
          fs.mkdirSync(output, { recursive: true })
          const browser = await chromium.launch({ headless: true })
          const errors = []
          const review = { result: 'PASS', states: {}, consoleErrors: errors }

          async function openState(mode, viewport, screenshot) {
            const page = await browser.newPage({ viewport })
            page.on('console', msg => { if (msg.type() === 'error') errors.push(`${mode}: ${msg.text()}`) })
            page.on('pageerror', err => errors.push(`${mode}: ${err.message}`))
            await page.goto(`http://127.0.0.1:4173/visual-review.html?mode=${mode}`, { waitUntil: 'networkidle' })
            await page.screenshot({ path: `${output}/${screenshot}`, fullPage: true })
            return page
          }

          try {
            const grid = await openState('grid', { width: 1280, height: 900 }, 'ovnis-grid-desktop.png')
            const gridState = await grid.evaluate(() => ({
              visibleText: document.body.innerText,
              bodyOverflow: document.documentElement.scrollWidth > window.innerWidth,
              overlay: Boolean(document.querySelector('.vite-error-overlay, #webpack-dev-server-client-overlay')),
              noUrlBadges: [...document.querySelectorAll('[title="source has no URL"]')].map(e => e.textContent.trim()),
            }))
            if (!gridState.visibleText.includes('PRUFON-TEST-001') || !gridState.visibleText.includes('PRUFON-TEST-002')) throw new Error('Grid did not render both controlled rows')
            if (gridState.bodyOverflow) throw new Error('Desktop grid causes page-level horizontal overflow')
            if (gridState.overlay) throw new Error('Vite error overlay detected')
            if (gridState.noUrlBadges.length !== 1 || gridState.noUrlBadges[0] !== 'No URL') throw new Error(`Expected one readable grid No URL badge, got ${JSON.stringify(gridState.noUrlBadges)}`)
            review.states.grid = gridState
            await grid.close()

            const valid = await openState('valid', { width: 1280, height: 900 }, 'ovnis-valid-source-detail.png')
            const link = valid.locator('a[href="https://example.com/source-record"]')
            await link.waitFor({ state: 'visible' })
            const linkMeta = await link.evaluate(a => ({ href: a.href, target: a.target, rel: a.rel, text: a.textContent.trim(), visible: Boolean(a.getClientRects().length) }))
            if (!linkMeta.visible || linkMeta.target !== '_blank' || !linkMeta.rel.includes('noopener') || !linkMeta.rel.includes('noreferrer')) throw new Error(`Unsafe or invisible source link: ${JSON.stringify(linkMeta)}`)
            const popupPromise = valid.waitForEvent('popup')
            await link.click()
            const popup = await popupPromise
            const popupUrl = popup.url()
            if (!popupUrl.startsWith('https://example.com/source-record')) throw new Error(`Source click opened unexpected URL: ${popupUrl}`)
            await popup.close()
            review.states.valid = { linkMeta, popupUrl }
            await valid.close()

            const noUrl = await openState('no-url', { width: 1280, height: 900 }, 'ovnis-no-url-detail.png')
            const noUrlState = await noUrl.evaluate(() => ({
              invalidAnchorCount: [...document.querySelectorAll('a')].filter(a => a.textContent.includes('Inexplicata / Scott Corrales')).length,
              citationVisible: [...document.querySelectorAll('*')].some(e => e.textContent.trim() === 'Inexplicata / Scott Corrales' && e.getClientRects().length > 0),
              noUrlBadgeCount: [...document.querySelectorAll('*')].filter(e => e.textContent.trim() === 'No URL' && e.getClientRects().length > 0).length,
            }))
            if (noUrlState.invalidAnchorCount !== 0 || !noUrlState.citationVisible || noUrlState.noUrlBadgeCount < 2) throw new Error(`Citation-only state failed: ${JSON.stringify(noUrlState)}`)
            review.states.noUrl = noUrlState
            await noUrl.close()

            const mobile = await openState('grid', { width: 390, height: 844 }, 'ovnis-grid-390x844.png')
            const mobileState = await mobile.evaluate(() => ({
              bodyOverflow: document.documentElement.scrollWidth > window.innerWidth,
              width: window.innerWidth,
              scrollWidth: document.documentElement.scrollWidth,
              visibleText: document.body.innerText,
            }))
            if (mobileState.bodyOverflow) throw new Error(`390px page overflow: ${mobileState.scrollWidth} > ${mobileState.width}`)
            if (/PRII|\b\w+-pr\b/.test(mobileState.visibleText)) throw new Error(`Forbidden visible branding: ${mobileState.visibleText}`)
            review.states.mobile = mobileState
            await mobile.close()

            if (errors.length) throw new Error(`Browser console errors: ${errors.join(' | ')}`)
          } catch (error) {
            review.result = 'FAIL'
            review.error = error instanceof Error ? `${error.name}: ${error.message}\n${error.stack}` : String(error)
          } finally {
            fs.writeFileSync(`${output}/ovnis-review-ledger.json`, JSON.stringify(review, null, 2))
            await browser.close()
          }
          if (review.result !== 'PASS') process.exit(1)
          JS
      - name: Run browser review and capture status
        id: review
        working-directory: dashboard
        shell: bash
        run: |
          set +e
          mkdir -p visual-artifacts
          npm run dev -- --host 127.0.0.1 --port 4173 > visual-artifacts/vite.log 2>&1 &
          server_pid=$!
          for i in {1..60}; do curl -fsS http://127.0.0.1:4173/visual-review.html >/dev/null && break; sleep 1; done
          node visual-review.spec.mjs > visual-artifacts/browser.log 2>&1
          status=$?
          kill "$server_pid" 2>/dev/null || true
          echo "$status" > visual-artifacts/exit-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ovnis-visual-review-diagnostic
          path: dashboard/visual-artifacts
          if-no-files-found: error
      - name: Enforce review result
        working-directory: dashboard
        run: |
          test "$(cat visual-artifacts/exit-status.txt)" = "0"
