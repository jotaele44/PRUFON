name: centinelas-intake

# Event-driven intake from Centinelas (the federation sentinel).
#
# Centinelas classifies anomalous items found on the Internet and POSTs each to
# this repo as a repository_dispatch of type `centinelas-signal`. This workflow
# adapts the dispatched signal into an OVNIS candidate feed
# (scripts/ingest_centinelas_dispatch.py), then runs the SAME reviewed intake
# pipeline used for local feeds (scripts/import_candidates.py --apply): normalize
# -> score -> dedupe -> route into the candidate + aux ledgers. The master ledger
# is read-only — import_candidates never writes it, and the pull request opened
# below explicitly excludes data/master/. Promotion into master remains a
# separate, human-gated step (scripts/promote_candidate.py).

on:
  repository_dispatch:
    types: [centinelas-signal]

permissions:
  contents: write
  pull-requests: write

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Adapt Centinelas dispatch into a candidate feed
        run: |
          python scripts/ingest_centinelas_dispatch.py \
            --event "$GITHUB_EVENT_PATH" \
            --out reports/intake/centinelas_feed.jsonl
          echo "Adapted feed:"
          cat reports/intake/centinelas_feed.jsonl || true

      - name: Run candidate intake (routes into aux ledgers; never master)
        run: |
          python scripts/import_candidates.py reports/intake/centinelas_feed.jsonl \
            --apply \
            --report reports/intake/routing_report.csv

      - name: Validate ledgers after intake
        run: |
          python3 scripts/validate_case_ledgers.py \
            data/candidates/candidate_cases.jsonl \
            data/master/master_cases.jsonl \
            data/already_listed.jsonl \
            data/updates_new_evidence.jsonl \
            data/echoes_noise.jsonl

      - name: Upload routing report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: centinelas-intake-routing-report
          path: reports/intake/routing_report.csv
          if-no-files-found: warn

      - name: Open intake pull request (candidate + aux ledgers only; never master)
        uses: peter-evans/create-pull-request@v6
        with:
          base: main
          branch: centinelas-intake/routed-signal
          delete-branch: true
          # Explicitly scope committed paths so master_cases.jsonl can never be included.
          add-paths: |
            data/candidates/candidate_cases.jsonl
            data/already_listed.jsonl
            data/updates_new_evidence.jsonl
            data/echoes_noise.jsonl
            reports/intake/routing_report.csv
          commit-message: "Centinelas intake: route dispatched signal into candidate/aux ledgers (never master)"
          title: "Centinelas intake: routed sentinel signal into candidate/aux ledgers"
          labels: candidate-intake
          body: |
            Automated intake of a Centinelas `centinelas-signal` repository_dispatch.

            - Adapted via `scripts/ingest_centinelas_dispatch.py`, then routed by
              `scripts/import_candidates.py --apply`.
            - Routed rows appended to the candidate and aux ledgers only.
            - `data/master/master_cases.jsonl` is **not** touched (read-only by doctrine).
            - Routing report attached as the `centinelas-intake-routing-report` workflow artifact.

            Promotion of any of these rows into the master ledger is a separate,
            human-reviewed step (`scripts/promote_candidate.py --record-id <id> --i-have-reviewed`).
