name: Federation template drift

# Fails if this repo's shared launcher / desktop / schema boilerplate has drifted
# from the canonical templates in thehub-pr/federation-templates. Edit a template
# once in thehub-pr and re-render (tools/render_federation_templates.py) — do not
# hand-edit these rendered files here.
#
# The canonical renderer (thehub-pr/tools/render_federation_templates.py) is not
# published in thehub-pr yet, so this gate degrades gracefully: it runs the real
# drift check the moment that renderer exists, and until then emits a warning and
# passes rather than hard-failing on a not-yet-built dependency. Remove the guard
# in the final step once the renderer ships.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch thehub-pr sibling (owns the canonical templates)
        run: |
          ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git clone --depth 1 --branch "$ref" https://github.com/jotaele44/thehub-pr.git ../thehub-pr \
            || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: Assert no drift from canonical federation templates
        run: |
          renderer="../thehub-pr/tools/render_federation_templates.py"
          if [ ! -f "$renderer" ]; then
            echo "::warning::Canonical template renderer ($renderer) is not published in thehub-pr yet — skipping the federation template drift check until it ships."
            exit 0
          fi
          python "$renderer" --repo ovnis-pr --check
