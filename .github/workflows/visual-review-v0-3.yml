name: visual-review-v0-3

on:
  pull_request:
    branches: [main]
    paths:
      - "dashboard/**"
      - "desktop/**"
      - "PRII-OVNIS.app/**"
      - ".github/workflows/visual-review-v0-3.yml"

permissions:
  contents: read

jobs:
  dashboard-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard and browser
        working-directory: dashboard
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Create isolated visual harness
        working-directory: dashboard
        run: |
          cat > visual-review.html <<'HTML'
          <!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>OVNIS visual review</title></head><body><div id="root"></div><script type="module" src="/src/visual-review.jsx"></script></body></html>
          HTML
          cat > src/visual-review.jsx <<'JSX'
          import React, { useState } from 'react'
          import ReactDOM from 'react-dom/client'
          import '@fontsource-variable/inter'
          import '@fontsource/jetbrains-mono'
          import '@/index.css'
          import '@pr-federation/react/styles.css'
          import '@/styles/federation.css'
          import CaseGrid from '@/components/CaseGrid.jsx'
          import CaseDetail from '@/components/CaseDetail.jsx'

          document.documentElement.dataset.repo = 'ovnis-pr'
          document.documentElement.dataset.theme = 'dark'

          const common = {
            date_raw: '2026-07-25',
            decade: '2020s',
            description: 'Controlled visual-review record with a long description to exercise wrapping without changing production data.',
            evidence_tier: 'T1',
            evidence_type: 'Official record',
            confidence: 'high',
            source_family: 'FAA',
            location: { municipality: 'San Juan', place: 'Controlled review location', lat: 18.4655, lon: -66.1057 },
            witness: { class: 'Official', count: 2, name: 'Review fixture' },
          }
          const cases = [
            { ...common, case_id: 'PRUFON-TEST-001', source_url: 'https://example.com/source-record', source_citation: 'Official source record' },
            { ...common, case_id: 'PRUFON-TEST-002', source_url: 'Inexplicata / Scott Corrales', source_citation: 'Inexplicata / Scott Corrales' },
          ]

          function Harness() {
            const [selected, setSelected] = useState(null)
            return <main className="min-h-screen bg-slate-950 p-3 text-slate-100">
              <h1 className="mb-2 text-lg font-semibold">OVNIS Source Review</h1>
              <section id="case-grid-review" className="h-[420px] overflow-hidden rounded-lg border border-slate-800 bg-slate-950">
                <CaseGrid cases={cases} selectedId={selected?.case_id} onSelect={setSelected} />
              </section>
              <CaseDetail case={selected} onClose={() => setSelected(null)} />
            </main>
          }
          ReactDOM.createRoot(document.getElementById('root')).render(<Harness />)
          JSX
          cat > visual-review.spec.mjs <<'JS'
          import { chromium } from 'playwright'
          import fs from 'node:fs'

          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } })
          const errors = []
          page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()) })
          page.on('pageerror', err => errors.push(err.message))
          await page.goto('http://127.0.0.1:4173/visual-review.html', { waitUntil: 'networkidle' })
          await page.screenshot({ path: 'visual-artifacts/ovnis-grid-desktop.png', fullPage: true })

          const initial = await page.evaluate(() => ({
            bodyText: document.body.innerText,
            bodyOverflow: document.documentElement.scrollWidth > window.innerWidth,
            overlay: Boolean(document.querySelector('.vite-error-overlay, #webpack-dev-server-client-overlay')),
            noUrlBadges: [...document.querySelectorAll('[title="source has no URL"]')].map(e => e.textContent.trim()),
          }))
          if (!initial.bodyText.includes('PRUFON-TEST-001') || !initial.bodyText.includes('PRUFON-TEST-002')) throw new Error('Case grid did not render both controlled rows')
          if (initial.bodyOverflow) throw new Error('Desktop page has horizontal overflow')
          if (initial.overlay || errors.length) throw new Error(`Browser errors: ${errors.join(' | ')}`)
          if (initial.noUrlBadges.length !== 1 || initial.noUrlBadges[0] !== 'No URL') throw new Error('Grid missing exactly one readable No URL badge')

          await page.locator('tr', { hasText: 'PRUFON-TEST-001' }).click()
          const link = page.locator('a[href="https://example.com/source-record"]')
          await link.waitFor()
          const linkMeta = await link.evaluate(a => ({ href: a.href, target: a.target, rel: a.rel, text: a.textContent.trim() }))
          if (linkMeta.target !== '_blank' || !linkMeta.rel.includes('noopener') || !linkMeta.rel.includes('noreferrer')) throw new Error('Valid source link lacks safe external-link attributes')
          await page.screenshot({ path: 'visual-artifacts/ovnis-valid-source-detail.png', fullPage: true })

          await page.keyboard.press('Escape')
          await page.locator('tr', { hasText: 'PRUFON-TEST-002' }).click()
          await page.getByText('Inexplicata / Scott Corrales', { exact: true }).waitFor()
          const invalidState = await page.evaluate(() => ({
            invalidAnchorCount: [...document.querySelectorAll('a')].filter(a => a.textContent.includes('Inexplicata / Scott Corrales')).length,
            noUrlVisible: [...document.querySelectorAll('*')].some(e => e.textContent.trim() === 'No URL' && e.getClientRects().length > 0),
          }))
          if (invalidState.invalidAnchorCount !== 0 || !invalidState.noUrlVisible) throw new Error('Citation-only source is linked or lacks No URL badge')
          await page.screenshot({ path: 'visual-artifacts/ovnis-no-url-detail.png', fullPage: true })

          await page.keyboard.press('Escape')
          await page.setViewportSize({ width: 390, height: 844 })
          await page.reload({ waitUntil: 'networkidle' })
          const mobile = await page.evaluate(() => ({ bodyOverflow: document.documentElement.scrollWidth > window.innerWidth, width: window.innerWidth, scrollWidth: document.documentElement.scrollWidth }))
          if (mobile.bodyOverflow) throw new Error(`Mobile page overflow: ${mobile.scrollWidth} > ${mobile.width}`)
          await page.screenshot({ path: 'visual-artifacts/ovnis-grid-390x844.png', fullPage: true })

          const visibleText = await page.locator('body').innerText()
          if (/PRII|\b\w+-pr\b/.test(visibleText)) throw new Error(`Forbidden visible branding found: ${visibleText}`)
          fs.writeFileSync('visual-artifacts/ovnis-review-ledger.json', JSON.stringify({
            result: 'PASS', initial, linkMeta, invalidState, mobile, consoleErrors: errors,
          }, null, 2))
          await browser.close()
          JS
      - name: Run visual assertions
        working-directory: dashboard
        run: |
          mkdir -p visual-artifacts
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/ovnis-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:4173/visual-review.html >/dev/null && break; sleep 1; done
          node visual-review.spec.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ovnis-visual-review
          path: dashboard/visual-artifacts
          if-no-files-found: error

  macos-identity:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bundle identity and render icon
        shell: bash
        run: |
          set -euo pipefail
          plist="PRII-OVNIS.app/Contents/Info.plist"
          display=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")
          icon_key=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$plist")
          test "$display" = "OVNIS"
          test "$name" = "OVNIS"
          test "$icon_key" = "AppIcon"
          icon="PRII-OVNIS.app/Contents/Resources/AppIcon.icns"
          test -s "$icon"
          mkdir -p macos-identity-artifacts
          sips -s format png "$icon" --out macos-identity-artifacts/ovnis-app-icon.png >/dev/null
          printf '{"result":"PASS","CFBundleDisplayName":"%s","CFBundleName":"%s","CFBundleIconFile":"%s","iconBytes":%s}\n' "$display" "$name" "$icon_key" "$(stat -f%z "$icon")" > macos-identity-artifacts/ovnis-macos-ledger.json
      - uses: actions/upload-artifact@v4
        with:
          name: ovnis-macos-identity
          path: macos-identity-artifacts
          if-no-files-found: error
